name: Manual Deploy
on: 
  workflow_dispatch: # This allows Backstage to trigger it
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying
        run: echo "Deploying to ${{ github.event.inputs.environment }}..."
